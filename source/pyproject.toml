[project]
name = "vafpy"
version = "0.1.0"
description = "AFQMC k-point code (vafpy and vafpy_v1) with NumPy, JAX, and CuPy backends; parallelized via mpi4py"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mpi4py>=4.0.3",
    "numpy>=2.2.5",
    "jax[cuda12]>=0.6.0",
    "cupy-cuda12x>=13.0.0",
    "opt-einsum>=3.4.0",
    "pyyaml>=6.0.2",
    "scipy>=1.15.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "scalene>=1.5.51",
]

[project.scripts]
vafpy = "vafpy.run_kpts:main"
vafpy-v1 = "vafpy_v1.run_kpts:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vafpy", "vafpy_v1"]
